services:
  - type: web
    name: paperbook-compiler
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAPERBOOK_USER
        sync: false
      - key: PAPERBOOK_PASS
        sync: false
